name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install --group test
      - run: pytest

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # uv binaries (~200 MB) are downloaded by processResources; cache them so
      # only a version bump in build.gradle.kts triggers a re-download.
      - name: Cache uv binaries
        uses: actions/cache@v4
        with:
          path: build/generated/runtime
          key: uv-binaries-${{ hashFiles('build.gradle.kts') }}
      - run: ./gradlew build --no-daemon
