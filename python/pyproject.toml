[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "qupath-tiatoolbox"
version = "0.2.0"
description = "Python sidecar for the TIAToolbox QuPath extension. Bridges QuPath (Java) to tiatoolbox engines via Py4J."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "tiatoolbox-qupath-extension contributors" }]
dependencies = [
    "py4j>=0.10.9.7",
    "tiatoolbox==2.1.0",
]

[project.scripts]
qupath-tiatoolbox = "qupath_tiatoolbox.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qupath_tiatoolbox"]
